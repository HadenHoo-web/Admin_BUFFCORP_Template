<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
.getpass-source-wrap{box-sizing:border-box;width:100%;height:100%;padding:14px 16px 10px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#333}
.getpass-source-head{display:flex;align-items:center;gap:12px;margin:0 0 22px}
.getpass-source-icon{width:18px;height:18px;border:2px solid #555;border-radius:2px;position:relative;box-sizing:border-box;transform:skew(-8deg)}
.getpass-source-icon:before,.getpass-source-icon:after{content:"";position:absolute;left:3px;right:3px;height:2px;background:#555}
.getpass-source-icon:before{top:5px}
.getpass-source-icon:after{top:10px}
.getpass-source-wrap h2{font-size:22px;line-height:1.2;margin:0;color:#333;font-weight:700;letter-spacing:0}
.getpass-status{display:none}
.getpass-status.error{display:block;padding:10px 14px;margin:0 0 18px;border:1px solid #f0b8b8;color:#b00000;background:#fff5f5;font-size:14px}
.getpass-source-total{color:#f00;font-size:18px;line-height:1.3;margin:0 0 34px}
.getpass-source-total b{font-weight:700}
.getpass-source-search{display:flex;align-items:center;gap:5px;margin:0 0 36px}
.getpass-source-search input{box-sizing:border-box;height:32px;width:122px;border:1px solid #8d8d8d;border-radius:3px;background:#fff;color:#f00;font-size:18px;line-height:32px;padding:3px 5px;box-shadow:inset 0 1px 1px rgba(0,0,0,.08)}
.getpass-source-search span{color:#333;font-size:14px}
.getpass-source-search button{height:40px;margin-left:2px;background:#337ab7;border:1px solid #2e6da4;color:#fff;font-size:16px;line-height:20px;padding:8px 18px;border-radius:4px;cursor:pointer}
.getpass-source-search button:hover{background:#286090;border-color:#204d74}
.getpass-table-scroll{overflow:auto;height:calc(100vh - 250px);min-height:360px;border-top:1px solid #e5e5e5}
.getpass-source-wrap .getpass-source-table{width:100%;border-collapse:collapse;table-layout:fixed}
.getpass-source-wrap .getpass-source-table td{box-sizing:border-box;border:1px solid #ddd;padding:6px 10px!important;font-size:13px!important;line-height:18px!important;color:#333!important;text-align:left!important;vertical-align:middle!important;text-indent:0!important;background-clip:padding-box}
.getpass-source-wrap .getpass-source-table tr.header td{position:sticky;top:-1;z-index:2;height:34px;background:#fff!important;border-bottom:2px solid #d7d7d7;font-weight:700!important;color:#333!important}
.getpass-source-wrap .getpass-source-table tr.alt td{background:#fbfbfb!important}
.getpass-source-wrap .getpass-source-table tr.inv td{background:#fff!important}
.getpass-source-wrap .getpass-source-table tr:hover td{background:#f4f9ff!important}
.getpass-source-wrap .getpass-source-table td:first-child{width:70px!important;color:#333!important}
.getpass-source-wrap .getpass-source-table td:nth-child(2){width:350px!important;font-weight:700!important}
.getpass-source-wrap .getpass-source-table tr:not(.header) td:nth-child(n+3){font-weight:700!important}
.getpass-source-wrap .getpass-source-table a{color:#1f75bd!important;text-decoration:none!important;font-size:12px!important;font-weight:400!important;margin-left:4px}
.getpass-source-wrap .getpass-source-table a:hover{text-decoration:underline!important}
</style>

<div class="getpass-source-wrap">
  <div class="getpass-source-head">
    <span class="getpass-source-icon"></span>
    	<h2>{PAGE_TITLE}</h2>
  </div>

  <div class="getpass-status {STATUS_CLASS}">{STATUS_TEXT}</div>

  <p class="getpass-source-total">Thong ke trong ngay {TODAY} : <b>{TODAY_TOTAL}</b></p>

  <form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" class="getpass-source-search">
    <input type="hidden" name="option" value="{funname}">
    <input type="hidden" name="mode" value="list">
    <input type="hidden" name="l" value="{LANGUAGEID}">
    <input name="from_date" type="text" value="{FROM_DATE}"> <span>-></span>
    <input name="to_date" type="text" value="{TO_DATE}">
    <button type="submit">Search</button>
  </form>

  <div class="getpass-table-scroll">
    {TABLE_HTML}
  </div>
</div>
