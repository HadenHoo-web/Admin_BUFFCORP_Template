<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<div class="toolbar"> <a href="JavaScript:doCreate()"><img border="0" src="templates/{skin}/images/button-article-create.gif" alt="Create new"><span>Create new</span></a>
</div>

<div class="tabtitle">Danh sách đi Profile : &quot;{di_profile_name}&quot; </div>
<div style="overflow:auto; height:80%">
  <table border="0" cellpadding="0" cellspacing="0" bordercolor="#111111" width="100%"  class="selector" style="border-collapse:collapse">
    <tr class="header">
      <td width="85" align="center" >#</td>
      <td width="300" align="left" >Link</td>
      <td width="200" align="left" >Groupkey Name</td>
	  <td width="200" align="left" >Profile</td>
	  <td width="200" align="left" >Anchor text</td>
      <td  colspan="5" ></td>
    </tr>
    <!-- BEGIN list -->
    <tr class="{list.className}{list.status}">
      <td width="85" align="center" style="vertical-align:middle">{list.order}</td>
      <td style="vertical-align:middle"><a href="{list.di_profile_name}" target="_blank">{list.di_profile_name}</a></td>
      <td style="vertical-align:middle"><a href="{list.url}" target="_blank">{list.groupkey_name}</a></td>
	  <td style="vertical-align:middle"><a href="{list.profile_name}" target="_blank">{list.profile_name}</a></td>
	  <td style="vertical-align:middle">{list.anchor_text}</td>
      <td width="23" align="center"><a href="?option={funname}&mode=up&id={list.di_profile_id}&l={LANGUAGEID}&parent_id={parent_id}"  target="_self"> <img border="0" src="templates/{skin}/images/up.png" width="16" height="16" style="{list.up}"></a> </td>
      <td width="28" align="center"><a href="?option={funname}&mode=down&id={list.di_profile_id}&l={LANGUAGEID}&parent_id={parent_id}" target="_self"> <img  style="{list.down}" border="0" src="templates/{skin}/images/down_blue.png" width="16" height="16"></a></td>
	  <td width="4%" align="center"><a href="JavaScript:subItem({list.di_profile_id})"><img border="0" src="templates/{skin}/images/button-article-list.gif" width="20" height="20" alt="Detail"></a></td>
      <td width="30" align="center"><a href="JavaScript:updateItem({list.di_profile_id})"><img border="0" src="templates/{skin}/images/editbutton.gif" alt="Update" width="20" height="20"></a></td>
      <td width="42" align="center"><a href="JavaScript:deleteItem({list.di_profile_id})"><img border="0" src="templates/{skin}/images/button-delete.gif" width="20" height="20" alt="Delete"></a></td>
    </tr>
    <!-- END list -->
  </table>
  </center>
</div>
<p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
<Script Language="JavaScript">

function doCreate()
{	
	document.location='?option={funname}&parent_id={parent_id}&mode=info&l={LANGUAGEID}'
}

function updateItem(id)
{	document.location = '?option={funname}&mode=info&l={LANGUAGEID}&id=' + id
}

function subItem(id)
{	document.location = '?option={funname}&mode=list&l={LANGUAGEID}&parent_id=' + id
}

function deleteItem(id)
{	if (confirm ("Are you sure you want to delete ?."))
		document.location = '?option={funname}&mode=delete&l={LANGUAGEID}&id=' + id
}	
</Script>
