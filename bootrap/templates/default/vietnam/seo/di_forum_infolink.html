<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">

 <div class="tabtitle">
 Thông tin Link to Link :</div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{di_forum_id}">
	<input type="hidden" name="mode" value="savelink">
<table width="100%">
  <tr >
    <td height="25" >Link cấp 1<font color="#FF0000">*</font></td>
    <td width="88%">
    <select size="1" name="link2_id" id="link2_id" value="0">
      <option value="0" selected>Link cấp 1</option>
      <!-- BEGIN select_list -->
      <option value="{select_list.di_forum_id}" >{select_list.di_forum_id}. {select_list.di_forum_name}</option>
      <!-- END select_list -->
    </select>
    </td>
  </tr>
  <tr >
    <td width="22%" height="25" >Chọn Forum:<font color="#FF0000">*</font></td>
    <td width="78%"><select size="1" name="forum_id" id="forum_id" value="0">
      <option value="0" selected> Chọn Forum</option>
      <!-- BEGIN forum_list -->
      <option value="{forum_list.forum_id}" >{forum_list.forum_id}.	{forum_list.forum_name}</option>
      <!-- END forum_list -->
    </select></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Link chi tiết:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="di_forum_name" notnull = 1 type="text" size="140" alt="Tên nhóm" value="{di_forum_name}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Anchor text:</td>
    <td width="78%"><input name="anchor_text" notnull = 1 type="text" size="140" alt="Anchor text" value="{anchor_text}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Chọn Book Mark:<font color="#FF0000">*</font></td>
    <td width="78%"><select size="1" name="bookmark_id" id="bookmark_id" value="0">
      <option value="0" selected> Chọn Book Mark</option>
      <!-- BEGIN bookmark_list -->
      <option value="{bookmark_list.bookmark_id}" >{bookmark_list.bookmark_id}.	{bookmark_list.bookmark_name}</option>
      <!-- END bookmark_list -->
    </select></td>
  </tr>
  <tr >
    <td width="22%" height="25" ></td>
    <td width="78%"></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Title seo:</td>
    <td width="78%"><input name="title_seo" notnull = 1 type="text" size="140" alt="title_seo" value="{title_seo}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Slug:</td>
    <td width="78%"><input name="slug" notnull = 1 type="text" size="140" alt="Slug" value="{slug}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Meta key:</td>
    <td width="78%"><textarea name="meta_key" cols="140" rows="10">{meta_key}</textarea></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Ghi chú:</td>
    <td width="78%"><textarea name="meta_des" cols="140" rows="5">{meta_des}</textarea></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Fanpage:</td>
    <td width="78%"><input name="fanpage" type="text" size="140" alt="Fanpage" value="{fanpage}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Youtube:</td>
    <td width="78%"><input name="youtube" type="text" size="140" alt="Youtube" value="{youtube}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Network 1:</td>
    <td width="78%"><input name="network1" type="text" size="140" alt="Network 1" value="{network1}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Network 2:</td>
    <td width="78%"><input name="network2" type="text" size="140" alt="Network 2" value="{network2}" /></td>
  </tr>
  <tr>
    <td ></td>
    <td ><input type="checkbox" name="active" value="1" id="fp1" {active} />
        <label for="fp1"> Active</label> <input type="checkbox" name="isindex" value="1" id="fp1" {isindex} /> <label for="fp1"> Index</label> <input type="checkbox" name="ishu" value="1" id="fp1" {ishu} />
        <label for="fp1"> Hư</label></td>
  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.forum_id.value = '{forum_id}';
	mainForm.link2_id.value = '{link2_id}';
	mainForm.bookmark_id.value = '{bookmark_id}';
	mainForm.di_forum_name.focus()
</Script>
