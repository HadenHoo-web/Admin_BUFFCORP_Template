<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Lưu"><span>Lưu</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Về danh sách" width="20" height="20"><span>Về danh sách</span></a>

</div>
 <div class="tabtitle">
 Forum chất lượng DA>20 - TF>15 - Link out<5 - DR>42 </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{link_id}">
	<input type="hidden" name="mode" value="save">
<table width="100%">
  <tr >
    <td width="22%" height="25" >Link Forum:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="link_name" notnull = 1 type="text" size="70" alt="Thương hiệu" value="{link_name}" /> <input name="view" type="text" size="5" alt="Xem" value="{view}" /> <input type="checkbox" name="active" value="1" id="fp1" {active} />
        <label for="fp1"> Active</label> <input type="checkbox" name="follow" value="1" id="fp1" {follow} />
        <label for="fp1"> Follow ( Do or No )</label></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Moz DA:</td>
    <td width="78%"><input name="da_point" notnull = 1 type="text" size="70" alt="Moz DA" value="{da_point}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Majestic TF:</td>
    <td width="78%"><input name="tf_point" notnull = 1 type="text" size="70" alt="Meta key" value="{tf_point}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >SEOQuake Link out:</td>
    <td width="78%"><input name="link_out" notnull = 1 type="text" size="70" alt="Meta des" value="{link_out}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Ahrefs DR:</td>
    <td width="78%"><input name="dr_point" notnull = 1 type="text" size="70" alt="Ahrefs DR" value="{dr_point}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Ghi chú:</td>
    <td width="78%"><textarea name="note" cols="80" rows="10">{note}</textarea></td>
  </tr>
  <tr>
    <td width="20%">
    Cập nhật hình:</td>
    <td width="80%">
   <input type="file" name="new_image" size="41"  alt="Logo"></td>
  </tr>
  <tr style="display:{allow}">
	 <td width="20%"></td>
		<td width="80%">
		{imgPath}
	  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.link_name.focus()
</Script>
