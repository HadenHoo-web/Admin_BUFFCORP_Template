<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Lưu"><span>Lưu</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Về danh sách" width="20" height="20"><span>Về danh sách</span></a>

</div>
 <div class="tabtitle">
 Forum chất lượng DA>20 - TF>15 - Link out<5 - DR>42 </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{forum_id}">
	<input type="hidden" name="mode" value="save">
<table width="100%">
  <tr >
    <td width="22%" height="25" >Trạng thái:</td>
    <td width="78%"><input type="checkbox" name="active" value="1" id="fp1" {active} /> <label for="fp1"> Active</label> Do or No <select name="follow" size="1"><option value="2">Chưa biết</option><option value="1">Do</option><option value="0">No</option></select> <input type="checkbox" name="isngon" value="1" id="fp1" {isngon} /> <label for="fp1"> Ngon</label> <input type="checkbox" name="isnew" value="1" id="fp1" {isnew} /> <label for="fp1"> Mới phát hiện</label> <input type="checkbox" name="isvn" value="1" id="fp1" {isvn} /> <label for="fp1"> Forum VN</label> Tình trạng <select name="isno" size="1"><option value="0">Chưa biết</option><option value="9">Ok - chỉ số cao</option><option value="8">Ok - chỉ số vừa</option><option value="7">Ok - chỉ số thấp</option><option value="6">Chưa đi - chỉ số cao</option><option value="5">Chưa đi - trung bình</option><option value="4">Chưa đi - Chỉ số thấp</option><option value="3">Chỉ Profile</option><option value="2">Chưa xem</option><option value="1">Bỏ</option></select></td>
	<script language="javascript">
	mainForm.follow.value = {follow};
	mainForm.isno.value = {isno};
    </script>
  </tr>
  <tr >
    <td width="22%" height="25" >Thông số:</td>
    <td width="78%">DA <input name="da_point" notnull = 1 type="text" size="1" alt="Moz DA" value="{da_point}" /> ; TF <input name="tf_point" notnull = 1 type="text" size="1" alt="Meta key" value="{tf_point}" /> ; Linkout <input name="link_out" notnull = 1 type="text" size="1" alt="Meta des" value="{link_out}" /> ; DR <input name="dr_point" notnull = 1 type="text" size="1" alt="Ahrefs DR" value="{dr_point}" /> Organic key <input name="organic_key" notnull = 1 type="text" size="1" alt="Moz DA" value="{organic_key}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Link Forum:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="forum_name" notnull = 1 type="text" size="34" alt="Url Forom" value="{forum_name}" /> Email <input name="email" notnull = 1 type="text" size="15" alt="Email" value="{email}" /> Pass <input name="pass" notnull = 1 type="text" size="10" alt="Password" value="{pass}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Ghi chú:</td>
    <td width="78%"><textarea name="note" cols="80" rows="20">{note}</textarea></td>
  </tr>
  <tr>
    <td width="20%">
    Cập nhật hình:</td>
    <td width="80%">
   <input type="file" name="new_image" size="41"  alt="Logo"></td>
  </tr>
  <tr style="display:{allow}">
	 <td width="20%"></td>
		<td width="80%">
		{imgPath}
	  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="100%" style="padding-left: 10" colspan="2" height="23"><b>Administration</b><hr></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Create date:</td>
      <td width="80%" height="23"><input type="text" name="T1" size="33" class="is_label" readonly value="{created_date}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Create by:</td>
      <td width="80%" height="23"><input type="text" name="created_by" size="33" class="is_label" readonly value="{created_by}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Last_modified</td>
      <td width="80%" height="23"> 
        <input type="text" name="last_modified" size="33" class="is_label" readonly value="{last_modified}">
      </td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Modified by</td>
      <td width="80%" height="23"><input type="text" name="modified_by" size="33" class="is_label" readonly value="{modified_by}"></td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.forum_name.focus()
</Script>
