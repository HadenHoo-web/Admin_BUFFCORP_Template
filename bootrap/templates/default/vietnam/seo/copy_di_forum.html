<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Lưu"><span>Copy</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Về danh sách" width="20" height="20"><span>Về danh sách</span></a>

</div>
 <div class="tabtitle">
 Link forum đi : 
 <!-- BEGIN group_list -->
 - <a href="{group_list.url}" target="_blank">{group_list.anchor_text}</a>
 <!-- END group_list -->
 </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{di_forum_id}">
	<input type="hidden" name="old_di_forum_name" value="{di_forum_name}">
	<input type="hidden" name="mode" value="docopy">
<table width="100%">
  <tr >
    <td width="22%" height="25" ></td>
    <td width="78%"><a href="{di_forum_name}" target="_blank">{di_forum_name}</a></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Link forum cần copy:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="new_di_forum_name" notnull = 1 type="text" size="70"/></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Forum:<font color="#FF0000">*</font></td>
    <td width="78%"><select size="1" name="forum_id" id="forum_id" value="0">
      <option value="0" selected> Chọn Forum</option>
      <!-- BEGIN forum_list -->
      <option value="{forum_list.forum_id}" >{forum_list.forum_id}.	{forum_list.forum_name}</option>
      <!-- END forum_list -->
    </select></td>
  </tr>
  <tr>
    <td ></td>
    <td ><input type="checkbox" name="active" value="1" id="fp1" {active} />
        <label for="fp1"> Active</label></td>
  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	
		if ( mainForm.new_di_forum_name.value == mainForm.old_di_forum_name.value || mainForm.forum_id.value == 0 ){
			alert('Trùng linh cũ hoặc quên chọn forum ! Nhập lại cẩn thận hơn');
		}else if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.di_forum_name.focus()
</Script>
