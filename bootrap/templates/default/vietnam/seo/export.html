<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<script type="text/javascript" src="js/ckeditor/ckeditor.js"></script>
<script src="js/ckeditor/_samples/sample.js" type="text/javascript"></script>
<link href="js/ckeditor/_samples/sample.css" rel="stylesheet" type="text/css" />	
<div class="toolbar">
  <a href="#" OnClick="doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Save"><span>Save</span></a>
  <a href="#" onClick="returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="List pages" width="20" height="20"><span>Page list</span></a>
</div>
<div class="tabtitle">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" id="mainForm" style="margin:0px;" >
	<input type="hidden" name="option" id="option" value="{funname}">
	<input type="hidden" name="mode" id="mode" value="export">
Danh sách đi forum : STT: <input name="from_date" id="from_date" type="text" size="8" value="{from_date}" style="height:17px;"> -> <input name="to_date" id="to_date" type="text" notnull="1" size="8" value="{to_date}" style="height:17px;"> 
	&nbsp; <select name="lever" size="1" onchange="doReShow()"><option value="0">Tầng 2</option><option value="1">Tầng 1</option></select> &nbsp; <select name="isindex1" size="1" onchange="doReShow()"><option value="2">All</option><option value="1">Index</option><option value="0">No index</option></select> <input type="checkbox" name="ishu1" value="1" {ishu1} /> Bị hư &nbsp;<input name="" type="submit" value="Export" style="height:18px; margin-top:4px;" />
 Sum: {num_link}</form>
</div>
<script>mainForm.lever.value = '{lever}';mainForm.isindex1.value = '{isindex1}';</script>
<div style="overflow:auto; height:80%">
<table width="100%">
<form action="main.php" name="mainForm" method="POST" enctype="multipart/form-data">
<input type="hidden" name="l" value="{LANGUAGEID}">
<input type="hidden" name="option" value="{funname}">
<input type="hidden" name="mode" value="save">
<input type="hidden" name="id"  value="{page_id}">
<input type="hidden" name="stat"  value="{status_id}">
  <tr>
    <td width="15%" valign="top" bgcolor="#F0F0F0" height="25" style="padding-top: 3">
    Nội dung chính:</td>
    <td width="85%" valign="top" bgcolor="#F0F0F0" height="25">      
<textarea cols="80" id="main_text" name="main_text" rows="10">
Bóp da cá sấu là phụ kiện thời trang có sức hút đặc biệt với đàn ông. Nó không chỉ thể hiện sự nam tính, phong cách với các loại bóp da cá sấu gai đuôi, gai lưng hoặc bóp da cá sấu nguyên con mà còn rất trang trọng, lịch lãm với các loại bóp cá sấu da trơn làm từ da phần bụng của cá sấu.

Bóp nam làm từ da cá sấu không chỉ được sử dụng như các loại bóp da thông thường mà còn mang ý nghĩa phong thủy rất đặc biệt trong văn hóa Á Đông, nguyên nhân vì cá sấu không tiết mồ hôi qua da, nên khi sử dụng bóp cá sấu sẽ giữ tiền bạc tốt hơn, không bị thất thoát khi không cần thiết.

→ Bóp da cá sấu Thành Vinh bảo hành trọn đời sút chỉ, bung keo.
→ Làm mới, đánh bóng miễn phí tại bất kì cửa hàng Thành Vinh trên toàn quốc.
→ Nhận đặt hàng theo mẫu, theo màu sắc bạn yêu thích.
<!-- BEGIN list -->
<p><b><a href="{list.di_forum_name}">{list.di_forum_name}</a></b></p>
<!-- END list -->
</textarea>
<script type="text/javascript">CKEDITOR.replace( 'main_text',{height : 600});</script>
</td>
  </tr>  
  </form>
  </table>
</div>
<Script Language="JavaScript">
	function doSave()
	{			
		if (verify(mainForm))	
		{	mainForm.submit()
		}
	}

	function returnToList()
	{	if ('{status_id}'=='')
			document.location='?option={funname}&mode=list&l={LANGUAGEID}&cid={cat_id}'
		else
			document.location='?option={funname}&mode=list_all&l={LANGUAGEID}&stat={status_id}'
	}
	
</Script>
<p align="center" class="message">{num_link} Link</p>
<p align="center" class="message">{MESSAGE}</p>
