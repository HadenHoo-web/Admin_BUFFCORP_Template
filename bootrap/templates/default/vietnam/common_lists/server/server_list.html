<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<div class="toolbar">
<a href="JavaScript:doCreate()"><img border="0" src="templates/{skin}/images/button-article-create.gif" alt="Create new"><span>Create new</span></a>
</div>

<div class="tabtitle"><form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" id="mainForm" style="margin:0px;" >
    <input type="hidden" name="option" id="option" value="{funname}">
    <input type="hidden" name="mode" id="mode" value="list">
  Danh sách Server.
  <select name="member_id1" onchange="doReShow()" style="display: {allow_member};">
    <option value="0">All NV</option>
    <!-- BEGIN member_list -->
    <option value="{member_list.member_id}">{member_list.member_name}</option>
    <!-- END member_list -->
  </select>
  </form></div><script>mainForm.member_id1.value = '{member_id}';</script>
<div style="overflow:auto; height:80%">
  <table border="0" cellpadding="0" cellspacing="0" bordercolor="#111111" width="100%"  class="selector" style="border-collapse:collapse">
    <tr class="header">
      <td width="20" align="center" >#</td>
      <td width="300" align="left" >Server</td>
      <td width="55" align="center" >Price</td>
      <td width="60" align="left" >Ngày Mua</td>
      <td width="90" align="left" >Ngày Hết Hạn</td>
      <td width="88" align="left" >IP</td>
      <td width="200" align="left" >Url</td>
      <td width="130" align="left" >User</td>
      <td width="130" align="left" >Pass</td>
      <td width="75" align="left" >NV QL</td>
      <td width="30" align="left" >Active</td>
      <td  colspan="4" ></td>
    </tr>
    <!-- BEGIN list -->
    <tr class="{list.className}{list.status}">
      <td align="center" style="vertical-align:middle">{list.order}</td>
      <td style="vertical-align:middle">{list.server_name}</td>
      <td align="right">{list.price}</td>
      <td style="vertical-align:middle">{list.order_date}</td>
      <td style="vertical-align:middle;color:{list.bg_server}">{list.exp_date} {list.days}</td>
      <td align="right">{list.ip_server}</td>
      <td style="vertical-align:middle"><a href="{list.url}" target="_blank">{list.url}</a></td>
      <td style="vertical-align:middle">{list.username}</td>
      <td style="vertical-align:middle">{list.pass}</td>
      <td style="vertical-align:middle">{list.member_name}</td>
      <td width="70" align="center" style="vertical-align:middle"><span style="display:{list.active}"><font face="Wingdings"><b><font size="3" color="#008000">ü</font></b></font></span></td>
      <td width="20" align="center"><a{list.is_owner} href="?option={funname}&mode=up&id={list.server_id}&l={LANGUAGEID}"  target="_self" style="display:{list.is_owner}"> <img border="0" src="templates/{skin}/images/up.png" width="16" height="16" style="{list.up}"></a> </td>
      <td width="20" align="center"><a{list.is_owner} href="?option={funname}&mode=down&id={list.server_id}&l={LANGUAGEID}" target="_self" style="display:{list.is_owner}"> <img  style="{list.down}" border="0" src="templates/{skin}/images/down_blue.png" width="16" height="16"></a></td>
      <td width="24" align="center"><a{list.is_owner} href="JavaScript:updateItem({list.server_id})" style="display:{list.is_owner}"><img border="0" src="templates/{skin}/images/editbutton.gif" alt="Update" width="20" height="20"></a></td>
      <td width="35" align="center"><a{list.is_owner} href="JavaScript:deleteItem({list.server_id})" style="display:{list.is_owner}"><img border="0" src="templates/{skin}/images/button-delete.gif" width="20" height="20" alt="Delete"></a></td>
    </tr>
    <!-- END list -->
  </table>
  </center>
</div>
<p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
<Script Language="JavaScript">
  function doReShow(){
    mainForm.submit();
  }
function doCreate()
{	
	document.location='?option={funname}&mode=info&l={LANGUAGEID}'
}

function updateItem(id)
{	document.location = '?option={funname}&mode=info&l={LANGUAGEID}&id=' + id
}

function deleteItem(id)
{	if (confirm ("Are you sure you want to delete ?."))
		document.location = '?option={funname}&mode=delete&l={LANGUAGEID}&id=' + id
}		
</Script>
