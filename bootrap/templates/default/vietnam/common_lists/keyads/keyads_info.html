<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Save"><span>Save</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Trở về danh sách phân loại đối tác" width="20" height="20"><span>Trở về danh sách</span></a>

</div>
 <div class="tabtitle">
 Thông tin keyads làm việc </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{keyads_id}">
	<input type="hidden" name="mode" value="save">
<table width="500">
  <tr >
    <td width="15%" height="25" >Chủ đề:<font color="#FF0000">*</font></td>
    <td><input name="keyads_name" notnull = "1" type="text" size="70" alt="Loại khách hàng" value="{keyads_name}" /></td>
  </tr>
  <tr >
    <td height="25" >Url đích:<font color="#FF0000">*</font></td>
    <td><input name="pass" notnull = "1" type="text" size="70" alt="Pass" value="{pass}" /></td>
  </tr>
  <tr >
    <td height="25" >Sort1:<font color="#FF0000">*</font></td>
    <td><input name="sort1" notnull = "1" type="text" size="70" value="{sort1}" /> <input type="checkbox" name="check_sort1" value="1" id="fp1" {check_sort1} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Sort2:<font color="#FF0000">*</font></td>
    <td><input name="sort2" notnull = "1" type="text" size="70" value="{sort2}" /> <input type="checkbox" name="check_sort2" value="1" id="fp1" {check_sort2} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Get1:<font color="#FF0000">*</font></td>
    <td><input name="get1" notnull = "1" type="text" size="70" value="{get1}" /> <input type="checkbox" name="check_get1" value="1" id="fp1" {check_get1} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Get2:<font color="#FF0000">*</font></td>
    <td><input name="get2" notnull = "1" type="text" size="70" value="{get2}" /> <input type="checkbox" name="check_get2" value="1" id="fp1" {check_get2} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Linkdown1:<font color="#FF0000">*</font></td>
    <td><input name="linkdown1" notnull = "1" type="text" size="70" value="{linkdown1}" /> <input type="checkbox" name="check_linkdown1" value="1" id="fp1" {check_linkdown1} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Linkdown2:<font color="#FF0000">*</font></td>
    <td><input name="linkdown2" notnull = "1" type="text" size="70" value="{linkdown2}" /> <input type="checkbox" name="check_linkdown2" value="1" id="fp1" {check_linkdown2} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Us1:<font color="#FF0000">*</font></td>
    <td><input name="us1" notnull = "1" type="text" size="70" value="{us1}" /> <input type="checkbox" name="check_us1" value="1" id="fp1" {check_us1} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Us2:<font color="#FF0000">*</font></td>
    <td><input name="us2" notnull = "1" type="text" size="70" value="{us2}" /> <input type="checkbox" name="check_us2" value="1" id="fp1" {check_us2} />
      <label kind="fp1"> OK</label></td>
  </tr>
  <tr >
    <td height="25" >Camp Traffic:</td>
    <td>
      <select size="1" name="camp_traffic_id" alt="Camp Traffic">
        <option value=0>Chọn Camp Traffic</option>
        <!-- BEGIN camp_traffic_list -->
        <option value="{camp_traffic_list.camp_traffic_id}">{camp_traffic_list.camp_traffic_name} [{camp_traffic_list.traffic_type_name}]</option>
        <!-- END camp_traffic_list -->
      </select> 
    </td>
  </tr>
  <tr >
    <td height="25" >Website:</td>
    <td>
      <select size="1" name="website_id" alt="Website">
        <option value=0>Chọn Website</option>
        <!-- BEGIN website_list -->
        <option value="{website_list.website_id}">{website_list.website_name}</option>
        <!-- END website_list -->
      </select> 
    </td>
  </tr>
  <tr >
    <td height="25" >Ghi chú:<font color="#FF0000">*</font></td>
    <td><textarea rows="20" cols="100" name="ghichu">{ghichu}</textarea></td>
  </tr>
  <tr>
    <td ></td>
    <td ><input type="checkbox" name="active" value="1" id="fp1" {active} /><label kind="fp1"> Đang Ads</label> <input type="checkbox" name="issave" id="fp1" value="1" {issave} /><label kind="fp1"> Lưu</label> <input type="checkbox" name="isstop" id="fp1" value="1" {isstop} /><label kind="fp1"> Dừng</label></td>
  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td style="padding-left: 10" height="23">Create date:</td>
      <td height="23"><input type="text" name="T1" size="33" class="is_label" readonly value="{created_date}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td style="padding-left: 10" height="23">Create by:</td>
      <td height="23"><input type="text" name="created_by" size="33" class="is_label" readonly value="{created_by}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td style="padding-left: 10" height="23">Last_modified</td>
      <td height="23"> 
        <input type="text" name="last_modified" size="33" class="is_label" readonly value="{last_modified}">
      </td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td style="padding-left: 10" height="23">Modified by</td>
      <td height="23"><input type="text" name="modified_by" size="33" class="is_label" readonly value="{modified_by}"></td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave(){	
    if(mainForm.camp_traffic_id.value == 0 || mainForm.camp_traffic_id.value == ''){	
      alert('chọn Camp Traffic ĐÚNG')
			mainForm.camp_traffic_id.focus()
			return
		}
    if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.keyads_name.focus()
  mainForm.website_id.value 	= {website_id}
  mainForm.camp_traffic_id.value 	= {camp_traffic_id}
</Script>
