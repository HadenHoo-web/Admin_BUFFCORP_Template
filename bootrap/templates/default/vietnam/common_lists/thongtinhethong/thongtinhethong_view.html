<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
.system-info-page{font-family:Tahoma,Arial,Helvetica,sans-serif;font-size:13px;color:#111;background:#e9e9e9;padding:10px;min-height:100%;box-sizing:border-box}
.system-info-toolbar{background:#f4f4f4;border:1px solid #888;border-bottom:0;padding:6px 8px}
.system-info-toolbar a{color:#000080;text-decoration:none;font-weight:bold;margin-right:14px}
.system-info-title{background:#808080;color:#fff;font-weight:bold;padding:6px 8px;border:1px solid #666}
.system-info-expiry{display:{expiry_display};background:#fff3cd;border:1px solid #f0ad4e;color:#9a5600;padding:8px;margin-top:8px;font-weight:bold}
.system-info-content{background:#fff;border:1px solid #c0c0c0;margin:12px auto 0;padding:38px 52px;max-width:920px;min-height:520px;white-space:normal;color:#111;box-shadow:0 1px 6px rgba(0,0,0,.18);box-sizing:border-box}
</style>

<div class="system-info-page">
  <div class="system-info-toolbar">
    <a href="{back_link}"><img border="0" src="templates/{skin}/images/back.gif" width="18" height="18" align="absmiddle"> Trở về danh sách</a>
    <a href="{download_link}" style="display:{download_display}"><img border="0" src="templates/{skin}/images/button-save.gif" width="18" height="18" align="absmiddle"> Tải file</a>
  </div>
  <div class="system-info-title">{info_title}</div>
  <div class="system-info-expiry">{expiry_message}</div>
  <div class="system-info-content">{content_html}</div>
</div>
