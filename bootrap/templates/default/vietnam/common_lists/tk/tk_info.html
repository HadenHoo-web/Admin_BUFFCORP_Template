<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
.share-user-wrap{display:inline-block;vertical-align:top}
.share-user-note{margin-top:4px;max-width:820px;line-height:20px}
.share-user-note span{display:inline-block;margin:0 4px 4px 0;padding:1px 6px;border:1px solid #b8c7dd;background:#eef5ff;color:#000080;font-size:11px;white-space:nowrap}
.share-user-note b{color:#333}
</style>
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Save"><span>Save</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Trở về danh sách phân loại đối tác" width="20" height="20"><span>Trở về danh sách</span></a>

</div>
 <div class="tabtitle">
 Thông tin Tài Khoản </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{tk_id}">
	<input type="hidden" name="mode" value="save">
<table width="100%">
    <tr >
        <td width="22%" height="25" >Tên Gọi:<font color="#FF0000">*</font></td>
        <td width="78%"><input name="alias" notnull = "1" type="text" size="70" alt="Loại khách hàng" value="{alias}" /></td>
    </tr>
  <tr >
    <td width="22%" height="25" >User:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="tk_name" notnull = "1" type="text" size="70" alt="Loại khách hàng" value="{tk_name}" /></td>
  </tr>
    <tr >
        <td width="22%" height="25" >Pass:<font color="#FF0000">*</font></td>
        <td width="78%"><input name="pass" notnull = "1" type="text" size="70" alt="Pass" value="{pass}" /></td>
    </tr>
  <tr >
    <td width="22%" height="25" >Link TK:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="tk_url" notnull = "1" type="text" size="70" alt="Loại khách hàng" value="{tk_url}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >NV QL:</td>
    <td width="78%">
      <select size="1" name="member_id" alt="Member" {allow_edit}>
        <option value=0>NV QL</option>
        <!-- BEGIN member_list -->
        <option value="{member_list.member_id}">{member_list.member_name}</option>
        <!-- END member_list -->
      </select>
      <span class="share-user-wrap">
        Share user ID : <input name="share_user_id" type="text" size="20" alt="Số lượng" value="{share_user_id}" />
        <div class="share-user-note">
          <!-- BEGIN share_member_note -->
          <span>{share_member_note.member_name}:<b>{share_member_note.member_id}</b></span>
          <!-- END share_member_note -->
        </div>
      </span>
    </td>
  </tr>
  <tr >
    <td width="22%" height="25" >Email:</td>
    <td width="78%">
    <!-- DO ComboFromTable("email_id", "tbl_emails", "email_id", "email_name", "email_id", 0, "Chọn Email" , "0" , "1 and active = 1 order by  email_name" , "", 1) --> 
    </td>
  </tr>
  <tr >
    <td width="22%" height="25" >Số điện thoại:</td>
    <td width="78%">
    <!-- DO ComboFromTable("tel_id", "tbl_tels", "tel_id", "tel_name", "tel_id", 0, "Chọn SĐT" , "0" , "1 and active = 1 order by  priority" , "", 1) --> 
    </td>
  </tr>
  <tr >
      <td width="22%" height="25" >Loai TK:</td>
      <td width="78%">
            <!-- DO ComboFromTable("tk_type_id", "tbl_tk_type", "tk_type_id", "tk_type_name", "tk_type_id", 0, "Chọn Loại TK" , "0" , "1 and active = 1 order by  priority" , "", 1) -->
      </td>
  </tr>
    <tr >
        <td width="22%" height="25" >Thuộc dự án:</td>
        <td width="78%">
            <!-- DO ComboFromTable("website_id", "tbl_website", "website_id", "website_name", "website_id", 0, "Chọn Dự Án " , "0" , "1 and active = 1 order by  website_name" , "", 1) -->
        </td>
    </tr>
  <tr >
    <td width="22%" height="25" >Ghi chú:<font color="#FF0000">*</font></td>
    <td width="78%"><textarea rows="20" cols="100" name="ghichu">{ghichu}</textarea></td>
  </tr>
  <tr>
    <td ></td>
    <td ><input type="checkbox" name="active" value="1" id="fp1" {active} />
        <label kind="fp1"> Active</label></td>
  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Create date:</td>
      <td width="80%" height="23"><input type="text" name="T1" size="33" class="is_label" readonly value="{created_date}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Create by:</td>
      <td width="80%" height="23"><input type="text" name="created_by" size="33" class="is_label" readonly value="{created_by}"></td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Last_modified</td>
      <td width="80%" height="23"> 
        <input type="text" name="last_modified" size="33" class="is_label" readonly value="{last_modified}">
      </td>
    </tr>
    <tr style="display:expression(('{is_new}' == '1') ? 'none' : '')">
      <td width="20%" style="padding-left: 10" height="23">Modified by</td>
      <td width="80%" height="23"><input type="text" name="modified_by" size="33" class="is_label" readonly value="{modified_by}"></td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	mainForm.alias.focus()
	mainForm.tel_id.value 	= {tel_id}
	mainForm.email_id.value  = {email_id}
  mainForm.member_id.value  = {member_id}
    mainForm.website_id.value  = {website_id}
    mainForm.tk_type_id.value  = {tk_type_id}
</Script>
