<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>

<div class="org-page">
  <div class="org-head">
    <div class="org-title">Chi tiết sơ đồ công ty</div>
    <div class="org-actions">
      <a href="{EDIT_URL}"><img border="0" src="templates/{skin}/images/editbutton.gif" width="18" height="18" align="absmiddle"> Sửa nội dung</a>
    </div>
  </div>
  <div class="org-note">{TABLE_MESSAGE}</div>

  <div class="org-layout">
    <div class="org-card">
      <div class="org-card-title">Sơ đồ nhân sự</div>
      <div class="org-chart-wrap">{ORG_TREE}</div>
    </div>

    <div class="org-card org-panel">
      <div class="org-card-title">Nhiệm vụ chính</div>
      <div class="org-detail">
        <div class="org-empty" id="orgEmpty">Bấm hoặc rê chuột vào từng nhân sự để xem nhiệm vụ riêng của người đó.</div>
        <div id="orgInfo" style="display:none">
          <div class="org-chip" id="orgGroup"></div>
          <div class="org-person-name" id="orgName"></div>
          <div class="org-role" id="orgRole"></div>
          <div class="org-info-row">
            <div class="org-label">Phòng ban</div>
            <div class="org-value" id="orgDepartment"></div>
          </div>
          <div class="org-info-row">
            <div class="org-label">Nhiệm vụ riêng</div>
            <div class="org-mission" id="orgMission"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
function orgText(id,value){
  var el=document.getElementById(id);
  if(!el)return;
  if(typeof el.textContent!='undefined')el.textContent=value||'';
  else el.innerText=value||'';
}
function orgRemoveActive(){
  var nodes=document.getElementsByClassName('org-person');
  for(var i=0;i<nodes.length;i++)nodes[i].className=nodes[i].className.replace(/\sactive/g,'');
}
function orgShowPerson(el,event){
  if(event&&event.stopPropagation)event.stopPropagation();
  if(!el)return;
  orgRemoveActive();
  if(el.className.indexOf('active')<0)el.className+=' active';
  var empty=document.getElementById('orgEmpty');
  var info=document.getElementById('orgInfo');
  if(empty)empty.style.display='none';
  if(info)info.style.display='block';
  orgText('orgGroup',el.getAttribute('data-group'));
  orgText('orgName',el.getAttribute('data-name'));
  orgText('orgRole',el.getAttribute('data-role'));
  orgText('orgDepartment',el.getAttribute('data-department'));
  orgText('orgMission',el.getAttribute('data-mission'));
}
window.onload=function(){
  var people=document.getElementsByClassName('org-person');
  for(var p=0;p<people.length;p++){
    if(people[p].getAttribute('data-name')){
      orgShowPerson(people[p]);
      break;
    }
  }
};
</script>
