<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <div class="toolbar">
<a href="JavaScript:doSave()"><img border="0" src="templates/{skin}/images/button-save.gif" width="20" height="20" alt="Save"><span>Save</span></a>
<a href="JavaScript:returnToList()"><img border="0" src="templates/{skin}/images/back.gif" alt="Trở về danh sách phân loại đối tác" width="20" height="20"><span>Trở về danh sách</span></a>

</div>
 <div class="tabtitle">
 Thông tin loại Website </div>
 <div style="overflow:auto; height:80%">
<form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" >
	<input type="hidden" name="l" value="{LANGUAGEID}">
	<input type="hidden" name="option" value="{funname}">
	<input type="hidden" name="id" value="{website_type_id}">
	<input type="hidden" name="mode" value="save">
<table width="100%">
  <tr >
    <td width="22%" height="25" >Loại Dự Án:<font color="#FF0000">*</font></td>
    <td width="78%"><input name="website_type_name" notnull = "1" type="text" size="70" alt="Loại Dự án" value="{website_type_name}" /></td>
  </tr>
  <tr >
    <td width="22%" height="25" >Màu:</td>
    <td width="78%">
      <input name="bg_color" id="bg_color" type="text" size="12" maxlength="7" value="{bg_color}" placeholder="#FFA500" />
      <input id="bg_color_picker" type="color" value="#ffffff" onchange="mainForm.bg_color.value=this.value" />
    </td>
  </tr>
  <tr>
    <td ></td>
    <td ><input type="checkbox" name="active" value="1" id="fp1" {active} />
        <label kind="fp1"> Active</label></td>
  </tr>
<tr style="visibility:{allow}">
      <td  colspan="2" >&nbsp;</td>
    </tr>
  </table>
   
</form><p align="center"><font color="#FF0000"><b>{MESSAGE}</b></font></p>
</div>
<Script Language="JavaScript">

	function doSave()
	{	if (verify(mainForm))	
			mainForm.submit()
	}

	function returnToList()
	{	document.location='?option={funname}&mode=list&l={LANGUAGEID}'
	}
	if (/^#[0-9A-Fa-f]{6}$/.test(mainForm.bg_color.value)) {
		document.getElementById('bg_color_picker').value = mainForm.bg_color.value;
	}
	mainForm.website_type_name.focus()
</Script>
