<div class="toolbar"> <a href="JavaScript:doCreate()"><img border="0" src="templates/{skin}/images/button-article-create.gif" alt="Tạo mới"><span>Tạo mới</span></a> <a href="JavaScript:doThongKe()" style="display:{isthongke}"><img border="0" src="templates/default/images/poll.png" alt="Create new"><span>Thống kê</span></a>

<Script Language="JavaScript">

function doCreate()

{	

	document.location='?option={funname}&mode=info&l={LANGUAGEID}'

}

function doReShow()

{	

	mainForm.submit();

}



function updateItem(id)

{	document.location = '?option={funname}&mode=info&l={LANGUAGEID}&id=' + id

}



function deleteItem(id)

{	if (confirm ("Are you sure you want to delete ?."))

		document.location = '?option={funname}&mode=delete&l={LANGUAGEID}&id=' + id

}

function doThongKe()

{

	document.location='?option={funname}&mode=thongke'

}

</Script>

<div class="tabtitle"><form action="main.php" method="POST" enctype="multipart/form-data" name="mainForm" id="mainForm" style="margin:0px;" >

	<input type="hidden" name="option" id="option" value="{funname}">

	<input type="hidden" name="mode" id="mode" value="list">

    Danh sách: Sum = {sum} => Tháng <select name="month" size="1" onchange="doReShow()"><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select> Năm <select name="year" size="1" onchange="doReShow()"><option value="2027">2027</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option></select><select name="thuchi1" onchange="doReShow()"><option value="2">All</option><option value="0">Thu</option><option value="1">Chi</option></select>

  <select name="loai1" onchange="doReShow()">

    <option value="0">All</option>

<!-- BEGIN loai_list -->

    <option value="{loai_list.loaikho_id}">{loai_list.loaikho_name}</option>

<!-- END loai_list -->

  </select>

  <select name="website_id1" onchange="doReShow()">

      <option value="0">All Đối Tác</option>

<!-- BEGIN website_list -->

      <option value="{website_list.website_id}">{website_list.website_name}</option>

<!-- END website_list -->

	</select>

  <select name="member_id1" onchange="doReShow()">

      <option value="0">All NV</option>

<!-- BEGIN member_list -->

      <option value="{member_list.member_id}">{member_list.member_name}</option>

<!-- END member_list -->

	</select></form></div><script>mainForm.month.value = '{month}';mainForm.year.value = '{year}';mainForm.thuchi1.value = '{thuchi}';mainForm.loai1.value = '{loai}';mainForm.website_id1.value = '{website_id}';mainForm.member_id1.value = '{member_id}';</script>

<div style="overflow:auto; height:80%">

  <table border="0" cellpadding="0" cellspacing="0" bordercolor="#111111" width="100%"  class="selector" style="border-collapse:collapse">

    <tr class="header">

      <td width="10" align="center" >#</td>

      <td width="35" align="left" >Ngày</td>

      <td width="40" align="left" >Số tiền</td>

      <td width="30" align="left" >Loại</td>

      <td width="200" align="left" >Lý do</td>

      <td width="80" align="left" >Website</td>

      <td width="35" align="left" >NV Nhập</td>

      <td width="50" align="left" >Lúc tạo</td>

      <td width="50" align="left" >Lúc sửa</td>

      <td  colspan="4" width="80"></td>

    </tr>

    <!-- BEGIN list -->

    <tr class="{list.className}{list.status}">

      <td align="center" style="vertical-align:middle">{list.order}</td>

      <td style="vertical-align:middle">{list.ngay}</td>

      <td style="vertical-align:middle; text-align:right;">{list.thuchi} {list.congno_name}</td>

      <td style="vertical-align:middle; text-align:right;">{list.loai}</td>

      <td style="vertical-align:middle">{list.congno_code}</td>

      <td>{list.website_name}</td>

      <td style="vertical-align:middle">{list.member_name}</td>

      <td style="vertical-align:middle">{list.created_date}</td>

      <td style="vertical-align:middle">{list.last_modified}</td>

      <td width="23" align="center"><a href="?option={funname}&mode=up&id={list.congno_id}&l={LANGUAGEID}"  target="_self"> <img border="0" src="templates/{skin}/images/up.png" width="16" height="16" style="{list.up}"></a> </td>

      <td width="28" align="center"><a href="?option={funname}&mode=down&id={list.congno_id}&l={LANGUAGEID}" target="_self"> <img  style="{list.down}" border="0" src="templates/{skin}/images/down_blue.png" width="16" height="16"></a></td>

      <td width="30" align="center"><a href="JavaScript:updateItem({list.congno_id})"><img border="0" src="templates/{skin}/images/editbutton.gif" alt="Update" width="20" height="20"></a></td>

      <td width="42" align="center"><a href="JavaScript:deleteItem({list.congno_id})"><img border="0" src="templates/{skin}/images/button-delete.gif" width="20" height="20" alt="Delete"></a></td>

    </tr>

    <!-- END list -->

  </table>

  </center>

</div>
