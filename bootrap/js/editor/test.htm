	<script>
	//init editor
	var oEdit0 = new InnovaEditor("oEdit0");
	oEdit0.scriptPath="scripts/";
	oEdit0.width="300";
	oEdit0.height="180";
	
	//turn some buttons off
	oEdit0.btnUndo=false;
	oEdit0.btnRedo=false;
	oEdit0.btnItalic=false;
	oEdit0.btnUnderline=false;
	oEdit0.btnJustifyLeft=false;
	oEdit0.btnBorder=false;
	oEdit0.btnForm=false;
	oEdit0.btnBookmark=false;
	oEdit0.btnGuidelines=false;
	oEdit0.btnPasteWord=false;
	oEdit0.btnIndent=false;
	oEdit0.btnOutdent=false;
	oEdit0.btnClean=false;
	oEdit0.btnNumbering=false;
	oEdit0.btnCut=false;
	oEdit0.btnCharacters=false;
	oEdit0.btnTagSelector=false;

	//turn on assets button
	oEdit0.btnAssets=true;
		
	//turn on internal link button
	oEdit0.btnInternalLink=true;
	oEdit0.cmdInternalLink = "modelessDialogShow('innova/InternalLinks.asp',465,250)"
	
	//map styles
	var sTmp="";
	var ss=document.styleSheets[0];
	for(var i=0;i<document.styleSheets[0].rules.length;i++)
		{
		if (ss.rules.item(i).selectorText=='P'||ss.rules.item(i).selectorText=='A'||ss.rules.item(i).selectorText=='A:hover'||ss.rules.item(i).selectorText=='A:link'||ss.rules.item(i).selectorText=='A:visited'){
			sSelector = ss.rules.item(i).selectorText;
			sCssText = ss.rules.item(i).style.cssText;
			sTmp+=",[\""+sSelector+"\",false,\"\",\""+ sCssText + "\"]";
		}
		if (ss.rules.item(i).selectorText=='.ContentTD'){
			sSelector = "BODY";
			sCssText = ss.rules.item(i).style.cssText;
			sTmp+=",[\""+sSelector+"\",false,\"\",\""+ sCssText + "\"]";
		}
		}
	var arrStyle = eval("["+sTmp.substr(1)+"]");
	oEdit0.arrStyle = arrStyle;	

	oEdit0.RENDER();	
	oEdit0.loadHTML(Edit0.innerHTML);
	</script>
