<html>
<head>
<title>List</title>
<style>
	body {font:8pt verdana,arial,sans-serif}
	.inpChk {width:13;height:13;margin-right:3;margin-bottom:1}
	.inpRdo {width:13;height:13;margin-right:3;margin-bottom:1}
	input {font:8pt verdana,arial,sans-serif}
	td {font-size:10}
	select {font:8pt verdana,arial,sans-serif}
</style>
<script language="JavaScript" src="selection_for_dialogs.js"></script>
<script>
/************************
	COMMON
************************/
function GetElement(oElement,sMatchTag)
	{
	while (oElement!=null && oElement.tagName!=sMatchTag)
		{
		if(oElement.id=="idContent") return null;
		oElement = oElement.parentElement;
		}
	return oElement;
	}
	
/************************
	REALTIME & Sekaligus PREVIEW
************************/
function doWindowFocus()
	{
	dialogArguments.document.all.btnRealTime.onclick=new Function("realTime()");
	}
function bodyOnLoad()
	{	
	window.onfocus=doWindowFocus;	
	dialogArguments.document.all.btnRealTime.onclick=new Function("realTime()");
	
	realTime()
	}
	
function realTime()
	{
	//*** SELECTION *********
	oSELUtil.check();
	if(!oSELUtil.oSel)return;
	oSel=oSELUtil.oSel;
	sType=oSELUtil.sType;
	//***********************
	
	var oName=dialogArguments.oUtil.oName;

	if (oSel.parentElement)	oEl=GetElement(oSel.parentElement(),"SELECT");
	else oEl=GetElement(oSel.item(0),"SELECT");

	if (oEl)
		{
		btnInsert.style.display="none";
		btnUpdate.style.display="block";
		btnUpdateAndClose.style.display="block";

		if(oEl.NAME)inpName.value=oEl.NAME;	
		if(oEl.name)inpName.value=oEl.name;	
		if(oEl.size)inpSize.value=oEl.size;
		if(oEl.multiple) chkMultiple.checked=true;
		else chkMultiple.checked=false;
		doMultiple(); //MULTIPLE or NOT
		
		//remove all
		var num = selOptions.options.length;
		for(var i=0;i<num;i++) selOptions.remove(0);
		
		for(var i=0;i<oEl.options.length;i++)
			{
			var sDisplayed = oEl.options.item(i).text;		
			var sValue = oEl.options.item(i).value;

			var oOption = document.createElement("OPTION")
			oOption.text = sValue + " ... " + sDisplayed
			
			if(oEl.options.item(i).selected) oOption.selected=true;
			
			selOptions.add(oOption)
			}
		}
	else
		{
		btnInsert.style.display="block";
		btnUpdate.style.display="none";
		btnUpdateAndClose.style.display="none";

		inpName.value="list1";
		inpSize.value="1";
		chkMultiple.checked=false;
		
		//remove all
		var num = selOptions.options.length;
		for(var i=0;i<num;i++) selOptions.remove(0);
		}
		
	inpValue.value="";
	inpDisplayed.value="";			
	}


function doApply()
	{
	//*** SELECTION *********
	oSELUtil.check();
	if(!oSELUtil.oSel)return;
	oSel=oSELUtil.oSel;
	sType=oSELUtil.sType;
	//***********************
	
	var oName=dialogArguments.oUtil.oName;

	if(chkMultiple.checked)
		{
		oSel.execCommand("InsertSelectListbox");
		var oEditor=eval("dialogArguments.idContent"+oName);
		oSel = oEditor.document.selection.createRange()
		oEl=GetElement(oSel.item(0),"SELECT");
		
		if(oEl.NAME) oEl.NAME=inpName.value;		
		else if(oEl.name) oEl.name=inpName.value;		
		else oEl.NAME=inpName.value; 
		
		if(inpSize.value!="") oEl.size=inpSize.value;
		oEl.multiple="multiple";
		}
	else
		{
		oSel.execCommand("InsertSelectDropdown");
		var oEditor=eval("dialogArguments.idContent"+oName);
		oSel = oEditor.document.selection.createRange()
		oEl=GetElement(oSel.item(0),"SELECT");
		
		if(oEl.NAME) oEl.NAME=inpName.value;		
		else if(oEl.name) oEl.name=inpName.value;		
		else oEl.NAME=inpName.value; 
		
		if(inpSize.value!="") oEl.size=inpSize.value;
		oEl.removeAttribute("multiple",0);
		}
		
	//remove all
	var num = oEl.options.length;
	for(var i=0;i<num;i++) oEl.remove(0);
		
	for(var i=0;i<selOptions.options.length;i++)
		{
		var sTmp = selOptions.options.item(i).text;		
		var arrTmp = sTmp.split(" ... ");

		var oOption = dialogArguments.document.createElement("OPTION")
		oOption.text = arrTmp[1]
		oOption.value = arrTmp[0]
		
		if(selOptions.options.item(i).selected) oOption.selected=true;
		
		oEl.add(oOption)
		}

	realTime()	
	}

/************************
	List
************************/
function doListAdd()
	{
	var oOption = document.createElement("OPTION")
	oOption.text = inpValue.value + " ... " + inpDisplayed.value
	selOptions.add(oOption)
	
	inpValue.value="";
	inpDisplayed.value="";	
	inpValue.focus();
	}	
function doListDel()
	{
	if(selOptions.selectedIndex==-1)return;
	selOptions.remove(selOptions.selectedIndex)
	}	
function doListUp()
	{
	if(selOptions.selectedIndex==-1)return;
	if(selOptions.selectedIndex==0) return;
	
	nSelectedIndex = selOptions.selectedIndex-1;
	var oBefore = selOptions.options.item(selOptions.selectedIndex-1)
	var oSelect = selOptions.options.item(selOptions.selectedIndex)
	for(var i=0;i<selOptions.options.length;i++)
		{
		if(selOptions.options.item(i)==oBefore)
			{
			sTmp = oSelect.text
			}
		else if(selOptions.options.item(i)==oSelect)
			{
			sTmp = oBefore.text
			}
		else
			{
			sTmp = selOptions.options.item(i).text
			}
		var oOption = document.createElement("OPTION")
		oOption.text = sTmp
		selTmp.add(oOption)
		}
	
	//remove all
	var num = selOptions.options.length;
	for(var i=0;i<num;i++) selOptions.remove(0);
	
	//fill
	for(var i=0;i<selTmp.options.length;i++)
		{
		var oOption = document.createElement("OPTION")
		oOption.text = selTmp.options.item(i).text
		selOptions.add(oOption)
		}
	
	//remove all
	var num = selTmp.options.length;
	for(var i=0;i<num;i++) selTmp.remove(0);
	
	selOptions.selectedIndex = nSelectedIndex
	}	
function doListDown()
	{
	if(selOptions.selectedIndex==-1)return;
	if(selOptions.selectedIndex+1==selOptions.options.length) return;
	
	nSelectedIndex = selOptions.selectedIndex+1;	
	var oSelect = selOptions.options.item(selOptions.selectedIndex)
	var oAfter = selOptions.options.item(selOptions.selectedIndex+1)
	for(var i=0;i<selOptions.options.length;i++)
		{
		if(selOptions.options.item(i)==oSelect)
			{
			sTmp = oAfter.text
			}
		else if(selOptions.options.item(i)==oAfter)
			{
			sTmp = oSelect.text
			}
		else
			{
			sTmp = selOptions.options.item(i).text
			}
		var oOption = document.createElement("OPTION")
		oOption.text = sTmp
		selTmp.add(oOption)
		}
	
	//remove all
	var num = selOptions.options.length;
	for(var i=0;i<num;i++) selOptions.remove(0);
	
	//fill
	for(var i=0;i<selTmp.options.length;i++)
		{
		var oOption = document.createElement("OPTION")
		oOption.text = selTmp.options.item(i).text
		selOptions.add(oOption)
		}
	
	//remove all
	var num = selTmp.options.length;
	for(var i=0;i<num;i++) selTmp.remove(0);
	
	selOptions.selectedIndex = nSelectedIndex
	}
	
function doMultiple()
	{
	if(chkMultiple.checked)selOptions.multiple="multiple";
	else selOptions.removeAttribute("multiple",0);
	}
</script>
<link rel="stylesheet" type="text/css" href="../../../templates/xp_theme/css/default.css">
</head>
<body onload="bodyOnLoad()" style="overflow:hidden;margin:0;background: #ffffff;filter: progid:DXImageTransform.Microsoft.gradient(startColorstr=#ededed, endColorstr=#f4f4f4)">


<table width=100% align=center style="height:100%" cellpadding=0 cellspacing=0>
<tr>
<td style="border-bottom:#f7f7f7 2 solid;background-color:#7e94ca;height:50;filter: progid:DXImageTransform.Microsoft.gradient(startColorstr=#f1f1f1, endColorstr=#d4d4d4);}" valign=middle>
	<font style="font-family:Arial Black;color:#3d4d5d;font-size:25;LETTER-SPACING:1px">&nbsp;List</font>
</td>
</tr>
<tr>
<td valign=top style="padding:5;padding-left:8;padding-right:15;padding-bottom:12;height:100%">


	<table>
	<tr>
		<td>Name:</td>
		<td style="padding-left:5;width:185"><INPUT type="text" ID="inpName" NAME="inpName" size=15 value="list1"></td>
	</tr>
	<tr>
		<td>Size:</td>
		<td style="padding-left:5"><INPUT type="text" ID="inpSize" NAME="inpSize" size=3></td>
	</tr>
	<tr>
		<td nowrap>Multiple select:</td>
		<td><INPUT type="checkbox" ID="chkMultiple" NAME="chkMultiple" onclick="doMultiple()">
		</td>
	</tr>
	<tr>
		<td colspan=2>Values:</td>
	</tr>
	<tr>
		<td colspan=2>
		<INPUT type="text" ID="inpValue" NAME="inpValue" size=10>
		<INPUT type="text" ID="inpDisplayed" NAME="inpDisplayed" size=10>
		<INPUT type="button" value="  add  " onclick="doListAdd()">
		<br>
		<table cellpadding=0 cellspacing=0>
		<tr>
		<td>
			<SELECT size=8 style="width:215px" ID="selOptions" NAME="selOptions" multiple>
			</SELECT>
		</td>
		<td>
			<INPUT type="button" value=" up " style="width:50px" onclick="doListUp()"><br>
			<INPUT type="button" value=" down " style="width:50px" onclick="doListDown()"><br>
			<INPUT type="button" value=" del " style="width:50px" onclick="doListDel()">
		</td>
		</tr>
		</table>
		<SELECT size=3 ID="selTmp" NAME="selTmp" style="display:none"></SELECT>
		
		</td>
	</tr>
	</table>


</td>
</tr>
<tr>
<td style="background-color:#efefef;border-top:#e6e6e6 2 solid;height:40;padding-right:15;" align=right valign=middle>
		<table callpadding=1 cellspacing=0>
		<td>
		<input type=button value="CLOSE" onclick="self.close()">
		</td>
		<td>
		<input type=button name=btnInsert value="INSERT" style="display:none" onclick="doApply()">
		</td>
		<td>
		<input type=button name=btnUpdate value="UPDATE" style="display:none" onclick="doApply()">
		</td>
		<td>
		<input type=button name=btnUpdateAndClose value="UPDATE & CLOSE" style="display:none;width:120" onclick="doApply();self.close()">
		</td>
		</table>
</td>
</tr>
</table>


</body>
</html>
