<html>
<head>
<title>Text Field</title>
<style>
	body {font:8pt verdana,arial,sans-serif}
	.inpChk {width:13;height:13;margin-right:3;margin-bottom:1}
	.inpRdo {width:13;height:13;margin-right:3;margin-bottom:1}
	input {font:8pt verdana,arial,sans-serif}
	td {font-size:10}
	select {font:8pt verdana,arial,sans-serif}
</style>
<script language="JavaScript" src="selection_for_dialogs.js"></script>
<script>
/************************
	COMMON
************************/
function GetElement(oElement,sMatchTag)
	{
	while (oElement!=null && oElement.tagName!=sMatchTag)
		{
		if(oElement.id=="idContent") return null;
		oElement = oElement.parentElement;
		}
	return oElement;
	}
	
/************************
	REALTIME & Sekaligus PREVIEW
************************/
function doWindowFocus()
	{
	dialogArguments.document.all.btnRealTime.onclick=new Function("realTime()");
	}
function bodyOnLoad()
	{	
	window.onfocus=doWindowFocus;	
	dialogArguments.document.all.btnRealTime.onclick=new Function("realTime()");
	
	realTime()
	}
	
	
function realTime()
	{
	//*** SELECTION *********
	oSELUtil.check();
	if(!oSELUtil.oSel)return;
	oSel=oSELUtil.oSel;
	sType=oSELUtil.sType;
	//***********************
	
	var oName=dialogArguments.oUtil.oName;
	
	//TEXT or PASSWORD
	if (oSel.parentElement)	oEl=GetElement(oSel.parentElement(),"INPUT");
	else oEl=GetElement(oSel.item(0),"INPUT");	
	if (oEl)
		{
		if(oEl.type=="text" || oEl.type=="password")
			{
			btnInsert.style.display="none";
			btnUpdate.style.display="block";
			btnUpdateAndClose.style.display="block";
			
			inpType.disabled=true;
			idNumLine.style.display="none";
			idMaxLength.style.display="block";
			
			inpType.value=oEl.type;
			if(oEl.NAME)inpName.value=oEl.NAME;	
			if(oEl.name)inpName.value=oEl.name;	
			inpValue.value=oEl.value;
			if(oEl.size) inpSize.value=oEl.size;
			if(oEl.maxlength) inpMaxLength.value=oEl.maxlength

			inpNumLine.value="";
			
			return;
			}
		}
	
	//TEXTAREA
	if (oSel.parentElement)	oEl=GetElement(oSel.parentElement(),"TEXTAREA");
	else oEl=GetElement(oSel.item(0),"TEXTAREA");	
	if (oEl)
		{
		btnInsert.style.display="none";
		btnUpdate.style.display="block";
		btnUpdateAndClose.style.display="block";

		inpType.disabled=true;
		idNumLine.style.display="block";
		idMaxLength.style.display="none";
		
		inpType.value=oEl.type;
		if(oEl.NAME)inpName.value=oEl.NAME;	
		if(oEl.name)inpName.value=oEl.name;		
		inpValue.value=oEl.value;
		if(oEl.size) inpSize.value=oEl.size;		
		if(oEl.rows) inpNumLine.value=oEl.rows;
		
		inpMaxLength.value="";
		
		return;
		}

	if (!oEl)
		{
		btnInsert.style.display="block";
		btnUpdate.style.display="none";
		btnUpdateAndClose.style.display="none";
		
		inpType.disabled=false;
		
		inpType.value="text";	
		inpName.value="text1";		
		inpValue.value="";
		inpSize.value="15";
		inpMaxLength.value="";
		inpNumLine.value="";
		}			
	}

function doApply()
	{
	//*** SELECTION *********
	oSELUtil.check();
	if(!oSELUtil.oSel)return;
	oSel=oSELUtil.oSel;
	sType=oSELUtil.sType;
	//***********************
	
	var oName=dialogArguments.oUtil.oName;

	if(inpType.value=="text")
		{
		oSel.execCommand("INSERTINPUTTEXT");
		var oEditor=eval("dialogArguments.idContent"+oName);
		oSel = oEditor.document.selection.createRange()
		oEl=GetElement(oSel.item(0),"INPUT");
		
		if(oEl.NAME) oEl.NAME=inpName.value;		
		else if(oEl.name) oEl.name=inpName.value;		
		else oEl.NAME=inpName.value; 
		
		oEl.value=inpValue.value;
		if(inpSize.value!="") oEl.size=inpSize.value;
		if(inpMaxLength.value!="") oEl.maxlength=inpMaxLength.value;
		}
	if(inpType.value=="password")
		{
		oSel.execCommand("INSERTINPUTPASSWORD");
		var oEditor=eval("dialogArguments.idContent"+oName);
		oSel = oEditor.document.selection.createRange()
		oEl=GetElement(oSel.item(0),"INPUT");
		
		if(oEl.NAME) oEl.NAME=inpName.value;		
		else if(oEl.name) oEl.name=inpName.value;		
		else oEl.NAME=inpName.value; 
			
		oEl.value=inpValue.value;
		if(inpSize.value!="") oEl.size=inpSize.value;
		if(inpMaxLength.value!="") oEl.maxlength=inpMaxLength.value;
		}
	if(inpType.value=="textarea")
		{
		oSel.execCommand("INSERTTEXTAREA");
		var oEditor=eval("dialogArguments.idContent"+oName);
		oSel = oEditor.document.selection.createRange()
		oEl=GetElement(oSel.item(0),"TEXTAREA");
		
		if(oEl.NAME) oEl.NAME=inpName.value;		
		else if(oEl.name) oEl.name=inpName.value;		
		else oEl.NAME=inpName.value; 
		
		oEl.value=inpValue.value;
		if(inpSize.value!="") oEl.size=inpSize.value;
		if(inpNumLine.value!="") oEl.rows=inpNumLine.value;;
		}	

	realTime()			
	}
	
function doChangeType()
	{
	if(inpType.value=="text" || inpType.value=="password")
		{
		idNumLine.style.display="none";
		idMaxLength.style.display="block"
		}
	else
		{
		idNumLine.style.display="block";
		idMaxLength.style.display="none"
		}
		
	if(inpType.value=="text")
		{
		inpName.value="text1"
		}
	if(inpType.value=="textarea")
		{
		inpName.value="textarea1"
		}
	if(inpType.value=="password")
		{
		inpName.value="password1"
		}		
	}			
</script>
<link rel="stylesheet" type="text/css" href="../../../templates/xp_theme/css/default.css">
</head>
<body onload="bodyOnLoad()" style="overflow:hidden;margin:0;background: #ffffff;filter: progid:DXImageTransform.Microsoft.gradient(startColorstr=#ededed, endColorstr=#f4f4f4)">


<table width=100% align=center style="height:100%" cellpadding=0 cellspacing=0 ID="Table2">
<tr>
<td style="border-bottom:#f7f7f7 2 solid;background-color:#7e94ca;height:50;filter: progid:DXImageTransform.Microsoft.gradient(startColorstr=#f1f1f1, endColorstr=#d4d4d4);}" valign=middle>
	<font style="font-family:Arial Black;color:#3d4d5d;font-size:25;LETTER-SPACING:1px">&nbsp;Text Field</font>
</td>
</tr>
<tr>
<td valign=top style="padding:5;padding-left:8;padding-right:15;padding-bottom:12;height:100%">

	<table width=100%>
	<tr>
		<td width=70>Type:</td>
		<td>
			<select name=inpType onchange="doChangeType()">
				<option value="text">Text</option>
				<option value="textarea">Textarea</option>
				<option value="password">Password</option>
			</select>
		</td>
	</tr>
	<tr>
		<td>Name:</td>
		<td><INPUT type="text" NAME="inpName" size=15 value="text1"></td>
	</tr>
	<tr>
		<td>Size:</td>
		<td><INPUT type="text" NAME="inpSize" size=3 value=15></td>
	</tr>
	<tr id=idMaxLength style="display:none">
		<td nowrap>Max Length:</td>
		<td><INPUT type="text" NAME="inpMaxLength" size=3></td>
	</tr>
	<tr id=idNumLine style="display:none">
		<td nowrap>Num Line:</td>
		<td><INPUT type="text" NAME="inpNumLine" size=3></td>
	</tr>
	<tr>
		<td valign=top>Value:</td>
		<td><TEXTAREA NAME="inpValue" size=30 rows=5></TEXTAREA></td>
	</tr>
	</table>

</td>
</tr>
<tr>
<td style="background-color:#efefef;border-top:#e6e6e6 2 solid;height:40;padding-right:15;" align=right valign=middle>
		<table callpadding=1 cellspacing=0>
		<td>
		<input type=button value="CLOSE" onclick="self.close()">
		</td>
		<td>
		<input type=button name=btnInsert value="INSERT" style="display:none" onclick="doApply()">
		</td>
		<td>		
		<input type=button name=btnUpdate value="UPDATE" style="display:none" onclick="doApply()">
		</td>
		<td>		
		<input type=button name=btnUpdateAndClose value="UPDATE & CLOSE" style="display:none;width:120" onclick="doApply();self.close()">
		</td>
		</table>
</td>
</tr>
</table>


</body>
</html>
